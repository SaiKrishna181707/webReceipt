name: WebReceipt verification

on:
  push:
    branches: [main, mf]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Verify custom Scraper Studio package, app, and chaos suite
        run: npm run verify
      - name: Stress-test the actual Next dev localhost workflow
        run: npm run stress:dev
      - name: Compile the production Next.js app and Bright Data API routes
        run: npm run build
      - name: Smoke-test the built Next.js API surface
        run: npm run smoke:next
      - name: Stress-test the built app on localhost
        run: npm run stress:next
