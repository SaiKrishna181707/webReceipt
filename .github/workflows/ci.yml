name: WebReceipt verification

on:
  push:
    branches: [main, mf]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify custom Scraper Studio package, app, and chaos suite
        run: npm run verify
      - name: Compile the production Next.js app and Bright Data API routes
        run: npm run build
