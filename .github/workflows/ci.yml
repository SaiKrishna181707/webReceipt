name: WebReceipt verification

on:
  push:
    branches: [main, mf]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Verify custom Scraper Studio package, app, and chaos suite
        run: npm run verify
      - name: Stress-test the actual Next dev localhost workflow
        run: npm run stress:dev
      - name: Browser-click the critical localhost UI workflow
        if: matrix.node == 20
        env:
          WEBRECEIPT_STATE_FILE: /tmp/webreceipt-browser-e2e.json
          WEBRECEIPT_ALLOW_PUBLIC_LIVE_OBSERVE: 'false'
          WEBRECEIPT_ALLOW_UNPROTECTED_LIVE: 'false'
        run: |
          npm run dev -- -H 127.0.0.1 -p 3000 > /tmp/webreceipt-browser-e2e.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 160); do
            if curl -fsS http://127.0.0.1:3000/console >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/webreceipt-browser-e2e.log
            exit 1
          fi
          npx --yes @playwright/test@1.55.0 test e2e/console.spec.cjs --reporter=line --workers=1
      - name: Compile the production Next.js app and Bright Data API routes
        run: npm run build
      - name: Smoke-test the built Next.js API surface
        run: npm run smoke:next
      - name: Stress-test the built app on localhost
        run: npm run stress:next
