<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafff1"/>
      <stop offset="0.28" stop-color="#8dffb1"/>
      <stop offset="0.52" stop-color="#33ff66"/>
      <stop offset="0.76" stop-color="#0bd957"/>
      <stop offset="1" stop-color="#dffff0"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="45%" r="58%">
      <stop offset="0" stop-color="#caffd9" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#33ff66" stop-opacity=".42"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".56" stop-color="#33ff66" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H18" stroke="#ffffff" stroke-opacity=".13" stroke-width="1"/>
      <circle cx="2" cy="2" r="1" fill="#33ff66" fill-opacity=".35"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="700" fill="#07130c"/>
  <rect width="1600" height="700" fill="url(#glow)"/>
  <path d="M-160 560 C260 260 520 720 820 420 S1250 180 1760 330" fill="none" stroke="url(#base)" stroke-width="58" stroke-opacity=".22" filter="url(#soft)"/>
  <path d="M-120 540 C300 290 520 680 820 410 S1260 170 1720 315" fill="none" stroke="url(#base)" stroke-width="9" stroke-opacity=".7"/>
  <path d="M-120 570 C300 320 520 710 820 440 S1260 200 1720 345" fill="none" stroke="#eafff1" stroke-width="2" stroke-opacity=".52"/>
  <rect width="1600" height="700" fill="url(#scan)" opacity=".52"/>
  <rect x="0" y="0" width="1600" height="700" fill="url(#sweep)" opacity=".25">
    <animate attributeName="x" from="-900" to="1600" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
