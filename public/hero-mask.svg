<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ffe7"/>
      <stop offset="0.22" stop-color="#78eaa0"/>
      <stop offset="0.48" stop-color="#18c968"/>
      <stop offset="0.72" stop-color="#54e58c"/>
      <stop offset="1" stop-color="#e5fff0"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="44%" r="62%">
      <stop offset="0" stop-color="#34df78" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#0fae55" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06120b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#eafff2" stop-opacity=".34"/>
      <stop offset=".54" stop-color="#33ff77" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0H16" stroke="#eafff2" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="2" cy="2" r=".8" fill="#5cff99" fill-opacity=".24"/>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#53e892" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="700" fill="#07100b"/>
  <rect width="1600" height="700" fill="url(#glow)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <path d="M-180 520 C240 270 540 650 820 400 S1260 190 1780 320" fill="none" stroke="url(#base)" stroke-width="48" stroke-opacity=".12" filter="url(#soft)"/>
  <path d="M-120 530 C280 300 530 630 820 405 S1260 200 1720 315" fill="none" stroke="url(#base)" stroke-width="5" stroke-opacity=".42"/>
  <path d="M-120 555 C280 325 530 655 820 430 S1260 225 1720 340" fill="none" stroke="#dfffee" stroke-width="1" stroke-opacity=".28"/>
  <rect width="1600" height="700" fill="url(#scan)" opacity=".7"/>
  <rect x="0" y="0" width="1600" height="700" fill="url(#sweep)" opacity=".18">
    <animate attributeName="x" from="-900" to="1600" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
